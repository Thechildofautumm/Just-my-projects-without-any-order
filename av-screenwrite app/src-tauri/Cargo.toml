[package]
name = "av-scenariy"
version = "0.2.0"
description = "AV-сценарий — редактор двухколоночных сценариев"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "av_scenariy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# Оболочка: окно и webview.
tauri = { version = "=2.12.5", features = [] }
# Системные диалоги «Открыть» / «Сохранить как».
tauri-plugin-dialog = "=2.8.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
