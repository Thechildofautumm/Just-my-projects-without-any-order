<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AV-сценарий</title>
</head>
<body data-view="home">

<!-- Иконки: один спрайт, используются через <use href="#i-…"> -->
<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M16 3l4 4-4 4"/><path d="M20 7H4"/><path d="M8 21l-4-4 4-4"/><path d="M4 17h16"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></symbol>
  <symbol id="i-open" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4.5A1.5 1.5 0 013 13.5v-9A1.5 1.5 0 014.5 3h9A1.5 1.5 0 0115 4.5V5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v5"/><path d="M14 11v5"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M6 13l6 6 6-6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="2.5" y="6" width="13" height="12" rx="2"/><path d="M15.5 10.5l6-3.5v10l-6-3.5"/></symbol>
  <symbol id="i-audio" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0"/><path d="M12 17.5V21"/></symbol>
  <symbol id="i-grip" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.1"/><circle cx="15" cy="6" r="1.1"/><circle cx="9" cy="12" r="1.1"/><circle cx="15" cy="12" r="1.1"/><circle cx="9" cy="18" r="1.1"/><circle cx="15" cy="18" r="1.1"/></symbol>
  <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6.5 10h1M10.5 10h1M14.5 10h1M8 14h8"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.4 2.4 3.5 5.3 3.5 8.5s-1.1 6.1-3.5 8.5c-2.4-2.4-3.5-5.3-3.5-8.5S9.6 5.9 12 3.5z"/></symbol>
</svg>

<!-- ===== Экран «Проекты» ===== -->
<div id="viewHome" class="view">
  <header class="bar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect width="32" height="32" rx="8" class="logo-bg"/><path class="logo-play" d="M8 10.5v11l7-5.5z"/><path class="logo-lines" d="M19 11h6M19 16h6M19 21h4"/></svg>
      <span data-i18n="app.name"></span>
    </div>
    <div class="spacer"></div>
    <label class="langsel"><svg class="ic" aria-hidden="true"><use href="#i-globe"/></svg><span class="sr" data-i18n="lang.label"></span><select class="lang" data-i18n-aria="lang.label"></select></label>
  </header>
  <main class="home">
    <div class="home-head">
      <h1><span data-i18n="home.title"></span> <span class="count" id="homeCount" hidden></span></h1>
      <div class="home-tools">
        <label class="search-wrap"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><input id="search" type="search" class="search" data-i18n-ph="home.search" data-i18n-aria="home.search" autocomplete="off"></label>
        <button class="btn" id="hImport" type="button"><svg class="ic" aria-hidden="true"><use href="#i-open"/></svg><span data-i18n="home.import"></span></button>
        <button class="btn primary" id="hNew" type="button"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg><span data-i18n="home.new"></span></button>
      </div>
    </div>
    <div id="projects" class="cards" aria-live="polite"></div>
    <div id="homeEmpty" class="empty" hidden>
      <svg class="empty-art" viewBox="0 0 160 110" aria-hidden="true" focusable="false">
        <rect x="14" y="8" width="132" height="94" rx="6" class="ea-paper"/>
        <path d="M80 22v68M26 36h108" class="ea-rule"/>
        <path d="M30 26h18M86 26h18" class="ea-head"/>
        <path d="M30 48h36M30 58h28M86 48h40M86 58h44M86 68h30M30 80h32M86 80h38" class="ea-text"/>
      </svg>
      <p class="empty-title" id="homeEmptyTitle"></p>
      <p class="empty-hint" id="homeEmptyHint"></p>
    </div>
  </main>
</div>

<!-- ===== Экран редактора ===== -->
<div id="viewEditor" class="view" hidden>
  <div class="sticky-top">
  <header class="bar" id="bar">
    <button class="btn ghost back" id="bBack" type="button" data-i18n-title="bar.backHint"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg><span data-i18n="bar.back"></span></button>
    <span class="vsep" aria-hidden="true"></span>
    <div class="total" data-i18n-title="bar.total"><svg class="ic" aria-hidden="true"><use href="#i-clock"/></svg><b id="total">0:00</b><span id="totalSub"></span></div>
    <span class="savestate" id="saveState" role="status" aria-live="polite"></span>
    <div class="spacer"></div>
    <div class="export" role="group" data-i18n-aria="bar.export">
      <span class="export-label"><svg class="ic" aria-hidden="true"><use href="#i-download"/></svg><span data-i18n="bar.export"></span></span>
      <button class="btn seg" id="bPdf" type="button" data-i18n="bar.pdf" data-i18n-title="bar.pdfHint"></button>
      <button class="btn seg" id="bWord" type="button" data-i18n="bar.word" data-i18n-title="bar.wordHint"></button>
      <button class="btn seg" id="bAvs" type="button" data-i18n="bar.exportAvs" data-i18n-title="bar.exportAvsHint"></button>
    </div>
  </header>

  <div class="toolbar">
    <div class="tgroup">
      <button class="btn tool" id="bUndo" type="button" data-i18n-title="bar.undoHint" data-i18n-aria="bar.undo"><svg class="ic" aria-hidden="true"><use href="#i-undo"/></svg></button>
      <button class="btn tool" id="bRedo" type="button" data-i18n-title="bar.redoHint" data-i18n-aria="bar.redo"><svg class="ic" aria-hidden="true"><use href="#i-redo"/></svg></button>
    </div>
    <span class="vsep" aria-hidden="true"></span>
    <div class="tgroup" id="fmtbar" role="toolbar" data-i18n-aria="fmt.label">
      <button class="btn tool fmt" id="fBold" type="button" data-cmd="bold" data-i18n-title="fmt.bold" data-i18n-aria="fmt.bold" aria-pressed="false"><b>B</b></button>
      <button class="btn tool fmt" id="fItalic" type="button" data-cmd="italic" data-i18n-title="fmt.italic" data-i18n-aria="fmt.italic" aria-pressed="false"><i>I</i></button>
      <button class="btn tool fmt" id="fUnderline" type="button" data-cmd="underline" data-i18n-title="fmt.underline" data-i18n-aria="fmt.underline" aria-pressed="false"><u>U</u></button>
      <button class="btn tool fmt" id="fStrike" type="button" data-cmd="strikeThrough" data-i18n-title="fmt.strike" data-i18n-aria="fmt.strike" aria-pressed="false"><s>S</s></button>
      <button class="btn tool fmt" id="fClear" type="button" data-cmd="removeFormat" data-i18n-title="fmt.clear" data-i18n-aria="fmt.clear">T<sub>×</sub></button>
    </div>
    <div class="spacer"></div>
    <label class="wpm" data-i18n-title="bar.wpmHint"><span data-i18n="bar.wpm"></span><input id="wpm" type="number" min="40" max="400" step="5"><span data-i18n="bar.wpmUnit"></span></label>
    <button class="btn tool wide" id="bSwap" type="button" data-i18n-title="bar.swapHint"><svg class="ic" aria-hidden="true"><use href="#i-swap"/></svg><span data-i18n="bar.swap"></span></button>
  </div>
  </div>

  <main class="page">
    <div class="meta">
      <div class="tline"><input id="title" class="title" data-i18n-ph="meta.title" data-i18n-aria="meta.title" autocomplete="off"></div>
      <label class="field"><span data-i18n="meta.author"></span><input id="author" autocomplete="off"></label>
      <label class="field"><span data-i18n="meta.date"></span><input id="date" autocomplete="off"></label>
    </div>

    <div class="grid">
      <div class="head" aria-hidden="true">
        <span class="hn" data-i18n="head.num"></span>
        <span class="hv" id="hv"><svg class="ic" aria-hidden="true"><use href="#i-video"/></svg><span data-i18n="head.video"></span></span>
        <span class="hu" id="hu"><svg class="ic" aria-hidden="true"><use href="#i-audio"/></svg><span data-i18n="head.audio"></span></span>
        <span class="ht" data-i18n="head.time"></span>
      </div>
      <div id="rows"></div>
    </div>

    <button class="addrow" id="bAdd" type="button" data-i18n-title="row.add"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg><span data-i18n="row.addBtn"></span></button>
  </main>

  <details class="help">
    <summary><svg class="ic" aria-hidden="true"><use href="#i-keyboard"/></svg><span data-i18n="hint.title"></span></summary>
    <div class="help-body">
      <ul class="help-rules">
        <li data-i18n="hint.time"></li>
        <li data-i18n="hint.brackets"></li>
        <li data-i18n="hint.manual"></li>
        <li data-i18n="hint.autosave"></li>
      </ul>
      <dl class="keys">
        <dt><kbd>Ctrl</kbd>+<kbd>Enter</kbd></dt><dd data-i18n="keys.newRow"></dd>
        <dt><kbd>Ctrl</kbd>+<kbd>D</kbd></dt><dd data-i18n="keys.dupRow"></dd>
        <dt><kbd>Alt</kbd>+<kbd>↑</kbd> <kbd>↓</kbd></dt><dd data-i18n="keys.move"></dd>
        <dt><kbd>Ctrl</kbd>+<kbd>Z</kbd> · <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Z</kbd></dt><dd data-i18n="keys.undo"></dd>
        <dt><kbd>Ctrl</kbd>+<kbd>B</kbd> <kbd>I</kbd> <kbd>U</kbd></dt><dd data-i18n="keys.format"></dd>
        <dt><kbd>Ctrl</kbd>+<kbd>P</kbd></dt><dd data-i18n="keys.pdf"></dd>
        <dt><kbd>Ctrl</kbd>+<kbd>O</kbd></dt><dd data-i18n="keys.projects"></dd>
      </dl>
    </div>
  </details>
</div>

<input type="file" id="file" accept=".avs,.json,application/json" hidden>

<dialog id="dlg" class="dlg">
  <form method="dialog" id="dlgForm">
    <h2 id="dlgTitle"></h2>
    <p id="dlgText"></p>
    <div class="dlg-actions" id="dlgActions"></div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastAct" type="button" hidden></button></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
